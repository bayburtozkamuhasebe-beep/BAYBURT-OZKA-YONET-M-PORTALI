<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 135" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Circle Clip -->
    <clipPath id="circleClip">
      <circle cx="50" cy="76" r="41" />
    </clipPath>
    <!-- Soft Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Dark Navy Circle Background -->
  <circle cx="50" cy="76" r="41" fill="#241d49" />

  <!-- The Two Skyscraper Towers (Rising out from gable above circle) -->
  <!-- Left Tower -->
  <polygon points="36,25 47,19 47,56 36,56" fill="#507fe3" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />
  
  <!-- Right Tower (Taller) -->
  <polygon points="52.5,12 63.5,6 63.5,56 52.5,56" fill="#507fe3" stroke="#ffffff" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Gable Roof & Chevron Structure with Circle Clipping -->
  <g clip-path="url(#circleClip)">
    <!-- Outer White Chevron Frame -->
    <path d="M 17,105 L 17,70 L 50,49 L 83,70 L 83,105 L 75,105 L 75,74 L 50,58 L 25,74 L 25,105 Z" fill="#ffffff" />

    <!-- Middle Blue Chevron Band -->
    <path d="M 23,108 L 23,73 L 50,56 L 77,73 L 77,108 L 69,108 L 69,77 L 50,65 L 31,77 L 31,108 Z" fill="#507fe3" />

    <!-- Inner White Chevron Gap -->
    <path d="M 31,110 L 31,77 L 50,65 L 69,77 L 69,110 L 61,110 L 61,81 L 50,74 L 39,81 L 39,110 Z" fill="#ffffff" />

    <!-- Inner Blue Arch / Portal Building -->
    <path d="M 39,114 L 39,81 L 50,73 L 61,81 L 61,114 L 54,114 L 54,85 L 50,82 L 46,85 L 46,114 Z" fill="#507fe3" />

    <!-- Inner White Doorway / Portal Opening -->
    <path d="M 46,114 L 46,85 L 50,82 L 54,85 L 54,114 Z" fill="#ffffff" />

    <!-- Bottom Outer Rim Blue Arc Segment -->
    <path d="M 19,98 C 22,108 30,115 40,117 L 38,111 C 30,109 23,103 21,96 Z" fill="#507fe3" />
    <path d="M 81,98 C 78,108 70,115 60,117 L 62,111 C 70,109 77,103 79,96 Z" fill="#507fe3" />
  </g>

  <!-- Crisp Central Peak White Highlight Line over joining point -->
  <polyline points="36,56 50,48 63.5,56" fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
</svg>
